image: 'public.ecr.aws/bitnami/node:20'

stages:
  - install
  - dependencies
  - build
  - test

check:
  only:
    - merge_requests
  stage: dependencies
  cache:
    key: $CI_PROJECT_DIR
    paths:
      - node_modules/
    policy: pull
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - yarn install
    - yarn check:dependencies
  dependencies:
    - install

install:
  stage: install
  only:
    refs:
      - merge_requests
    changes:
      - package.json
  cache:
    key: $CI_PROJECT_DIR
    paths:
      - node_modules/
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - rm -rf node_modules
    - yarn install

build:
  stage: build
  only:
    - merge_requests
  cache:
    key: $CI_PROJECT_DIR
    paths:
      - node_modules/
    policy: pull
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - yarn install
    - yarn build-ci
    - rm -rf .git
  dependencies:
    - install
  artifacts:
    name: 'build-artifacts-$CI_PIPELINE_ID'
    expire_in: 30 minutes
    paths:
      - ./

# audit:
#   only:
#     - merge_requests
#   stage: dependencies
#   script:
#     - cd service
#     - yarn audit

lint:
  only:
    - merge_requests
  stage: test
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - yarn install
    - yarn lint
  dependencies:
    - install

unit-test:
  only:
    - merge_requests
  stage: test
  cache:
    key: $CI_PROJECT_DIR
    paths:
      - node_modules/
    policy: pull
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - yarn install
    - yarn test --coverage
  dependencies:
    - install
  artifacts:
    name: 'cov-artifact-$CI_PIPELINE_ID'
    expire_in: 1 day
    paths:
      - ./coverage

e2e-tests:
  only:
    - merge_requests
  stage: test
  cache:
    key: $CI_PROJECT_DIR
    paths:
      - node_modules/
    policy: pull
  variables:
    MYSQL_DATABASE: loop_test
    MYSQL_ROOT_PASSWORD: rootpassw0rd
    DB_HOST: db
    DB_PASSWORD: rootpassw0rd
    DB_PORT: 3306
    DB_USERNAME: root
    DB_DATABASE: loop_test
    NODE_ENV: development
    REDIS_HOST: redis
    REDIS_PASSWORD: ''
    REDIS_PORT: 6379
    ROLLBAR_ACCESS_TOKEN: $ROLLBAR_ACCESS_TOKEN
  services:
    - name: redis:5.0.7
      alias: redis
    - name: mysql:8.0.20
      alias: db
      entrypoint:
        [
          '/entrypoint.sh',
          '--default-authentication-plugin=mysql_native_password',
        ]
  script:
    - cd service
    - npm config set -- //gitlab.com/api/v4/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set -- //gitlab.com/api/v4/projects/24487110/packages/npm/:_authToken=${CI_JOB_TOKEN}
    - npm config set @ourloop:registry https://gitlab.com/api/v4/packages/npm/
    - yarn install
    - yarn test:integration
  dependencies:
    - install
