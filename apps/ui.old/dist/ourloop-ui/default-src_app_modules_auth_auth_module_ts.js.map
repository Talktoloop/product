<div>
  <label [ngClass]="{ 'label-disabled': disabled }" class="radio clickable">
    <input
      #radio
      (change)="handleValueChange()"
      (click)="handleClick($event)"
      [checked]="checked"
      [name]="name"
      [value]="value"
      type="radio"
    />
    <span
      tabindex="0"
      class="radio__icon d-inline-block"
      role="radio"
      [attr.aria-checked]="checked"
      (keydown.enter)="handleClick($event)"
    ></span>
    <span class="radio__content" (click)="handleClick($event)">
      <loop-icon [theme]="checked ? 'primary' : 'neutral'" [name]="iconName" [clickable]="true" [dark]="true"></loop-icon>
      <ng-content></ng-content
    ></span>
  </label>
</div>
