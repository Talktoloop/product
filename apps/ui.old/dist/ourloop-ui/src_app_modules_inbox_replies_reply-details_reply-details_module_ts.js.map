<div class="details-container" *ngIf="steps.length">
  <div class="details-header">
    <a class="details-header__back-arrow" [routerLink]="backUrl">
      <img class="arrow-image" src="assets/icons/arrow_previous_green.svg" alt="go back" />
      <span>{{ 'header.topBar.backToInbox' | translate }}</span>
    </a>
  </div>

  <app-route-stepper [steps]="steps"></app-route-stepper>
</div>
