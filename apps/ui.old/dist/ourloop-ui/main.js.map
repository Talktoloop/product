<button
  (click)="clicked.emit($event)"
  (blur)="blured.emit($event)"
  (focus)="focused.emit($event)"
  [ngClass]="[
    'button',
    variant,
    noPadding ? 'no-padding' : '',
    bigPadding ? 'big-padding' : '',
    fullWidth ? 'full-width' : '',
    mode ? mode : ''
  ]"
  [disabled]="disabled"
>
  <span class="content" [class.d-none]="loading">
    <ng-content></ng-content>
  </span>
  <app-inline-loading *ngIf="loading"></app-inline-loading>
</button>
