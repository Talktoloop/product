<div class="audio-player" (click)="state !== AudioPlayerState.Loading && onClick($event)">
  <div *ngIf="state !== AudioPlayerState.Loading; else loadingTemplate" class="audio-player__button">
    <img [src]="getIconSource()" />
  </div>
  <ng-template #loadingTemplate>
    <div class="audio-player__loader">
      <app-inline-loading [diameter]="isMobile ? 16 : 20"></app-inline-loading>
    </div>
  </ng-template>
  {{ getStatusText() | translate }}
</div>
