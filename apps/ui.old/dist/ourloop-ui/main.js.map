<div [ngClass]="[tagSize, tagTheme, isDisable]" class="simple-tag">
  <div class="left-icon" *ngIf="leftIcon">
    <ng-content select="[left-icon]"></ng-content>
  </div>

  <span class="simple-tag__name" data-testid="simple-tag__name">
    {{ text }}
  </span>

  <span class="country" *ngIf="country"><span class="dot">•</span> {{ 'country_name.' + country | translate }}</span>

  <loop-icon *ngIf="closeButton && !disable" (click)="close$.emit()" [name]="LoopIcon.Name.Close" [theme]="iconTheme"
    [size]="iconSize" class="close-icon simple-tag__icon"></loop-icon>

  <svg *ngIf="verified" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
    stroke="currentColor" class="verified-tag">
    <path stroke-linecap="round" stroke-linejoin="round"
      d="M9 12.75 11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 0 1-1.043 3.296 3.745 3.745 0 0 1-3.296 1.043A3.745 3.745 0 0 1 12 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 0 1-3.296-1.043 3.745 3.745 0 0 1-1.043-3.296A3.745 3.745 0 0 1 3 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 0 1 1.043-3.296 3.746 3.746 0 0 1 3.296-1.043A3.746 3.746 0 0 1 12 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 0 1 3.296 1.043 3.746 3.746 0 0 1 1.043 3.296A3.745 3.745 0 0 1 21 12Z" />
  </svg>

</div>
