<loop-autocomplete
  (addClicked)="autoComplete.handleOptionClick({ id: $event, name: $event })"
  (queryChanged)="queryChanged$.next($event)"
  [customSuffix]="suffix"
  [formControl]="control"
  [maxLength]="100"
  [options]="matchingPlaces"
  [placeholder]="'filtersV2.location.placeholder' | translate"
  [showAddOption]="true"
  [showAllWhenEmpty]="true"
  [showErrorIcon]="true"
>
  <ng-template #suffix></ng-template>
</loop-autocomplete>
