<div *ngIf="title" class="filter-v2-container__section-title">
  <span class="filter-v2-container__section-title-name">{{ title }}</span>
  <div class="separator"></div>
</div>
<ng-container [ngSwitch]="config.autocompleteType">
  <loop-country-filter *ngSwitchCase="AutocompleteType.COUNTRY" [formControl]="control"> </loop-country-filter>
</ng-container>
<button class="select-all filtersV2-link-button clear-all" (click)="onClearClicked()">
  {{ 'filtersV2.clear' | translate }}
</button>
