<div *ngIf="title && !flat" class="inbox-filter-container__section-title">
  <span class="inbox-filter-container__section-title-name">{{ title }}</span>
  <div class="separator"></div>
</div>

<form *ngIf="options$ | async as options" [formGroup]="form">
  <loop-checkbox-wrapper
    [formControlName]="controlName"
    [isModal]="false"
    [options]="options"
    [strictTranslationCode]="true"
  ></loop-checkbox-wrapper>
</form>
