<div #conversationWrapper class="conversation-wrapper" (scroll)="onScroll($event)">
  <ng-container *ngFor="let date of messages | keyvalue; trackBy: getTrackBy">
    <div class="timeline">
      <div class="midline"></div>
      <div class="date">{{ getDisplayDate(date.key) }}</div>
      <div class="midline"></div>
    </div>
    <div class="conversation" [@fadeAnimation]="'in'">
      <ng-container *ngFor="let message of date.value; trackBy: getTrackBy">
        <div [@fadeAnimation]="'in'" class="timestamp">
          <div
            class="timestamp__content"
            [ngClass]="{
              'timestamp__content--right': message.sender.type !== SENDER_TYPE.ISSUER
            }"
          >
            <ng-container *ngIf="message.sender.username || message.sender.username === null || message.sender.type === SENDER_TYPE.LOOP">
              <span>{{ getDisplayUsername(message.sender) }}</span>
              <strong>&middot;</strong>
            </ng-container>

            <ng-container *ngIf="message.storyId">
              <span class="highlight">
                {{ 'admin.pendingStoryReview.story' | translate }}
              </span>
              <strong>&middot;</strong>
            </ng-container>

            <span>{{ message.createdAt | date: 'hh:mm a' }}</span>

            <ng-container *ngIf="message.sender.type === SENDER_TYPE.ISSUER && !message.storyId">
              <strong>&middot;</strong>
              <app-pin-story
                *ngIf="storyDetailsService.isReviewStep"
                [isStoryPinned]="message.isPinned"
                (click)="pinToStory(message)"
              ></app-pin-story>
            </ng-container>
          </div>
        </div>
        <div
          [ngClass]="{
            'bubble--right': message.sender.type === SENDER_TYPE.ISSUER
          }"
          class="bubble"
        >
          <div [@fadeAnimation]="'in'" class="bubble__content" [ngClass]="getBubbleClass(message)">
            {{ message.content }}
          </div>
        </div>
      </ng-container>
    </div>
  </ng-container>
</div>

<div class="reply-wrapper" [class.shadow]="!scrolledToBottom">
  <ng-container *ngIf="!replySection; else replyContainer">
    <app-skeleton-loader class="w-100" [lines]="['big', 'big']"></app-skeleton-loader>
  </ng-container>

  <ng-template #replyContainer>
    <ng-container *ngIf="replySection.blocked; else replyInput">
      <div class="reply-unavailable">
        <app-info-icon></app-info-icon>
        <div [innerHTML]="replySection.message"></div>
      </div>
    </ng-container>
    <ng-template #replyInput>
      <app-textarea
        [disabled]="sendingReply"
        [noResize]="true"
        [maxlength]="maxSmsReplyLength"
        (onChange)="replyContentChanged($event)"
        (valueChanged)="replyContentChanged($event)"
      ></app-textarea>
      <app-button
        [disabled]="!replyContent?.length || replyContent?.length > maxSmsReplyLength || sendingReply"
        class=""
        variant="primary"
        (clicked)="replyClicked()"
      >
        <app-send-icon></app-send-icon>
        <span>{{ 'admin.pendingStoryReview.reply' | translate }}</span>
      </app-button>
    </ng-template>
  </ng-template>
</div>
