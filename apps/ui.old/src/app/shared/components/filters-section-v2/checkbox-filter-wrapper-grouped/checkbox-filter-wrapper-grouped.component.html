<div *ngIf="title" class="filter-v2-container__section-title"
  [class.mobile-title]="(ui.mobileView$ | async) && nestedModalMode">
  <div class="d-flex-space-between">
    <span class="filter-v2-container__section-title-name">{{ title }}</span>
    <app-button mode="v2" variant="link-3" class="filtersV2-link-button modal-see-all__button"
      *ngIf="isModal && !nestedModalMode && isAllFiltersModal" (clicked)="onSeeAllClicked($event)">
      {{ 'filtersV2.seeAll' | translate }}
      <app-expand-more-icon class="modal-see-all__icon"></app-expand-more-icon>
    </app-button>
  </div>
  <div class="separator" *ngIf="!nestedModalMode && isAllFiltersModal" [class.no-bottom-margin]="isModal"></div>
</div>
<ng-container *ngIf="!isModal; else listView">
  <div cy="checkbox-filter-wrapper-grouped" class="group-wrapper">
    <app-button *ngFor="let parent of filterData?.data; index as i" cy="checkbox-filter-wrapper-group-app-button"
      data-testid="checkbox-filter-wrapper-group-app-button" [class.d-none]="selected !== null"
      (clicked)="parentClicked($event, i)" class="w-100" variant="select-option">
      <span cy="checkbox-filter-wrapper-group-app-button-text"
        data-testid="checkbox-filter-wrapper-group-app-button-text" class="text">{{ parent.code | translate }}</span>
      <span class="count-container">
        <span *ngIf="selectedInGroup[i] as count" class="value">{{ count }}</span>
        <app-expand-more-icon rotate="-90" class="icon forward"></app-expand-more-icon>
      </span>
    </app-button>
    <app-button [class.d-none]="selected === null" (clicked)="backClicked($event)" (blured)="handleBackButtonBlur()"
      [mode]="'v2'" variant="link-3" class="thematic-back__btn">
      <app-expand-more-icon rotate="90"></app-expand-more-icon>
      <span class="ml-0">{{ filterData?.data[selected]?.code | translate }}</span>
    </app-button>
  </div>
  <div [formGroup]="form">
    <loop-checkbox-wrapper [class.d-none]="checkboxOptions?.length === 0" [options]="checkboxOptions"
      [strictTranslationCode]="true" [formControlName]="controlName" [bulkActionVisible]="selected !== null"
      [wideStyle]="selected === 1" (totalSelectedChange)="totalSelectedChange.emit($event)"
      [isModal]="false"></loop-checkbox-wrapper>
  </div>
</ng-container>
<ng-template #listView>
  <div class="checkbox-list__modal-view" [formGroup]="form" *ngIf="nestedModalMode || !isAllFiltersModal">
    <loop-checkbox-wrapper [flat]="true" [class.d-none]="checkboxOptions?.length === 0" [options]="checkboxOptions"
      [strictTranslationCode]="true" [formControlName]="controlName" [bulkActionVisible]="true" [wideStyle]="true"
      (totalSelectedChange)="totalSelectedChange.emit($event)" [isModal]="true"></loop-checkbox-wrapper>
  </div>
</ng-template>
