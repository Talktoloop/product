<div class="select" [class.full-width]="fullWidth" [class.flat]="flat">
  <div class="select__header" *ngIf="showHeader">
    <ng-content select="[header]"></ng-content>
    <div class="select__header-separator"></div>
  </div>
  <div class="select__options">
    <ng-content select="loop-select-option"></ng-content>
  </div>
  <div *ngIf="showSuffix" class="select__suffix">
    <ng-content select="[suffix]"></ng-content>
  </div>
</div>
