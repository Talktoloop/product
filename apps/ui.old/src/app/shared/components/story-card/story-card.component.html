<article class="card">
  <app-post-preview
    *ngIf="!loading; else skeleton"
    [postData]="story"
    [selfLinkClickable]="false"
    [showActions]="true"
    [postContentLimit]="limit"
  >
    <ng-content></ng-content>
  </app-post-preview>

  <ng-template #skeleton>
    <app-skeleton-text [lines]="8"></app-skeleton-text>
  </ng-template>
</article>
