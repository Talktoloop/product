<div cy="sort-picker" class="sort-picker-container" (appClickOutside)="handleOutsideClick()">
  <div #sortPicker class="sort-picker">
    <app-button [variant]="ui.mobileView ? 'link-2' : 'secondary'" mode="v2" (clicked)="handleSelectorOpenClick()" [appStopEvent]="'click'">
      <div class="flex-center font-1125 font-bold">
        {{ 'global.sort.' + sortControl?.value | translate }}
        <app-expand-more-icon [class.expand-rotated]="dropDownOpen ? 180 : 0"></app-expand-more-icon>
      </div>
    </app-button>
  </div>

  <loop-select
    *ngIf="dropDownOpen"
    [fullWidth]="true"
    [showHeader]="false"
    [showSuffix]="false"
    [sourceEl]="sortPicker"
    [sourceWidth]="sortPicker.clientWidth"
    appDropdown
  >
    <loop-select-option *ngFor="let sort of sortElements; trackBy: trackByFn" (clicked)="handleOptionClick(sort)">
      {{ 'global.sort.' + sort | translate }}
    </loop-select-option>
  </loop-select>
</div>
