apiVersion: "api.cerbos.dev/v1"
resourcePolicy:
  version: "default"
  resource: "feedback"
  rules:
    - actions: ["read", "update", "stop", "export"] 
      effect: "EFFECT_ALLOW"
      roles: ["MODERATOR", "CASE_MANAGER", "SUPER_ADMIN"]
    - actions: ["export"]
      effect: "EFFECT_ALLOW"
      roles: ["USER"]
      condition:
        match:
          expr: request.resource.attr.token != null