version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URL
      - echo Logged in successfully.

  build:
    commands:
      - echo Building the Docker image...
      - cd ${APP_PATH}
      - docker login --username abeloop --password dckr_pat_ajdMae5o45IQ3J1XZ6yeVwoEEAc
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      # Map CodeBuild's $ENVIRONMENT (e.g. dev, production) to the Angular config filename
      # in src/assets/config-${BUILD_ENV}.json. Stays env-agnostic — same buildspec on every branch.
      - |
        case "$ENVIRONMENT" in
          production) BUILD_ENV=production ;;
          dev|development) BUILD_ENV=development ;;
          staging)    BUILD_ENV=staging ;;
          *)          echo "Unknown ENVIRONMENT=$ENVIRONMENT, defaulting to staging" && BUILD_ENV=staging ;;
        esac
      - echo "Building UI with config-${BUILD_ENV}.json"
      - docker build . --target=final --build-arg env=${BUILD_ENV} --tag $ECR_URL:$IMAGE_TAG

  post_build:
    commands:
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - echo Pushing the Docker image to Amazon ECR with tag $IMAGE_TAG...
      - docker push $ECR_URL:$IMAGE_TAG
      - docker tag $ECR_URL:$IMAGE_TAG $ECR_URL:latest
      - docker push $ECR_URL:latest
      - printf '[{"name":"%s","imageUri":"%s"}]' ${APP_NAME} $ECR_URL:$IMAGE_TAG > imagedefinitions.json
      - echo Build and push completed successfully.

artifacts:
  files: '**/*'
