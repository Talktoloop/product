<div class="mt-2">
    <ng-container *ngIf="otherStoriesSameRecipient?.length;else noHistory">
        <div class="feedback-item" *ngFor="let feedback of otherStoriesSameRecipient">
            <span class="feedback-status">{{ 'story.status.' + feedback.status | translate | titlecase}}</span>
            <span class="feedback-date">{{ feedback.createdAt | date:'dd MMMM yy'}}</span>
        </div>

    </ng-container>
    <ng-template #noHistory>
        <div class="no-history">
            {{ 'story.details.review.other.noHistory' | translate }}
        </div>
    </ng-template>
</div>
