<div class="audio-player">
  <div class="audio-player__button" (click)="click$.emit()">
    <loop-icon [name]="getIconName()" [theme]="LoopIcon.Theme.Action" [isButton]="true"></loop-icon>
  </div>
  <div class="audio-player__control control">
    <div class="control__time">
      {{ currentTime | duration }}
    </div>
    <div class="control__progress-bar">
      <mat-slider
        draggable="true"
        min="0"
        max="1"
        step="0.01"
        [value]="this.getProgress() || 0"
        (mousedown)="click$.emit()"
        (mouseup)="click$.emit()"
        (change)="onChange($event)"
      ></mat-slider>
    </div>
    <div class="control__time">
      {{ duration | duration }}
    </div>
  </div>
</div>
