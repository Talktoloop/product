<ng-container *ngIf="isLoopMember">
  <app-button [disabled]="downloadInProgress" mode="v2" variant="link-5" (click)="onDownloadClick()">
    {{ 'unifiedFeedbackExportButton.text' | translate }}
  </app-button>
  <div class="loader" *ngIf="downloadInProgress">
    <img ngSrc="assets/icons/loader.gif" height="150" width="150" alt=""/>
  </div>
</ng-container>
