<label class="toggle" [class.toggle--checked]="checked">
  <div class="toggle__bar">
    <input
      class="visually-hidden"
      role="switch"
      type="checkbox"
      tabindex="0"
      [attr.aria-checked]="checked"
      [ngModel]="checked"
      (change)="toggleCheckbox()"
    />
    <div class="toggle__thumb-container">
      <div class="toggle__thumb"></div>
    </div>
  </div>
  <span class="body-default">{{ label }}</span>
</label>
