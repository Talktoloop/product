<div class="textarea" [class.invalid]="isInvalid" [ngClass]="[theme]">
  <div class="textarea__header" *ngIf="showHeader">
    <div *ngIf="maxLength" class="textarea__max-length-counter">
      <app-info-icon
        *ngIf="infoTooltip"
        [lockTooltipMobile]="false"
        [maxWidth]="tooltipWidth"
        [tooltipDelay]="tooltipDelay"
        [tooltipOffset]="tooltipOffset"
        [tooltipPadding]="tooltipPadding"
        [tooltipPlacement]="tooltipPlacement"
        [tooltipText]="infoTooltip"
        appTooltip
        class="textarea__max-length-counter-icon"
      ></app-info-icon>
      <span class="textarea__max-length-counter-text" *ngIf="!disabled">{{ valueLength }} / {{ maxLength }}</span>
    </div>
  </div>
  <textarea
    cy="loop-textarea-textarea"
    data-testid="loop-textarea-textarea"
    class="textarea__element"
    [class.textarea__element--invalid]="isInvalid"
    [class.textarea__element--small]="small"
    [(ngModel)]="value"
    (ngModelChange)="onValueChange($event)"
    [id]="id"
    [rows]="minRows"
    [appInvalidFocusable]="isInvalid"
    [placeholder]="placeholder"
    [attr.inputmode]="inputmode"
    [attr.autocomplete]="autocomplete"
    [disabled]="disabled"
    [attr.maxlength]="maxLength"
    [readOnly]="readonly"
    [maxlength]="maxLength"
    (focus)="handleFocus($event)"
    (blur)="handleBlur()"
    [autosize]="autosize"
  ></textarea>

  <p class="textarea__error" data-testid="validationError" [class.textarea__error--visible]="isInvalid">
    {{ errorMessage$ | async }}
  </p>
</div>
