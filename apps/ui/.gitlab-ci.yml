install:
  stage: install
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/
    policy: pull-push
  script:
    - yarn install
  only:
    - merge_requests

audit:
  only:
    - merge_requests
  stage: dependencies
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/
    policy: pull
  script:
    - yarn npm audit --severity high

build:
  stage: build
  only:
    - merge_requests
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules
    policy: pull
  script:
    - yarn run build:prod

codestyle:
  only:
    - merge_requests
  stage: build
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/
    policy: pull
  script:
    - yarn run codestyle:check

deploy_after_mr:
  only:
    variables:
      - $CI_COMMIT_TITLE =~ /^Merge branch (.*) 'develop/
  stage: deploy
  script:
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/develop --force
    - git push awscommit --tags --force

deploy_to_development:
  only:
    variables:
      - $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "web"
  stage: deploy
  script:
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/testbuild --force
    - git push awscommit --tags --force

deploy_to_staging:
  only:
    variables:
      - $CI_COMMIT_BRANCH == "staging" && $CI_PIPELINE_SOURCE == "web"
  stage: deploy
  script:
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/staging --force
    - git push awscommit --tags --force

deploy_to_production:
  only:
    variables:
      - $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "web"
  stage: deploy
  script:
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/production --force
    - git push awscommit --tags --force

deploy_anything:
  only:
    variables:
      - $CI_COMMIT_BRANCH != "develop" && $CI_COMMIT_BRANCH != "master" && $CI_COMMIT_BRANCH != "staging" && $CI_PIPELINE_SOURCE == "web"
  stage: deploy
  script:
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/testbuild --force
    - git push awscommit --tags --force

deploy_develop:on-schedule:
  only:
    variables:
      - $DEPLOY_DEVELOP == "true"
  stage: deploy
  cache:
    key:
      files:
        - yarn.lock
    paths:
      - node_modules/
      - .yarn/
    policy: pull
  script:
    - apt update -qq && apt install -y jq
    - |
      curl -s -u $JIRA_INTEGRATION_AUTH  -X GET    -H "Content-Type: application/json" $JIRA_JQL_PATH | jq -r '.issues[].self' | xargs -L 1 -I{} curl -s -u $JIRA_INTEGRATION_AUTH -H "Content-Type: application/json"  -d '{"transition":{"id":"51"}}' -X POST {}/transitions?expand=transitions.fields
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/develop --force
    - git push awscommit --tags --force

bump_version:
  only:
    - merge_requests
  stage: version
  cache: []
  before_script:
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
  script:
    - env
    - |
      git fetch origin
      if (git diff --name-only origin/develop | grep src/assets/localisation/); then
      apt update -qq && apt install -y jq
      cat src/environments/translations.version.ts | sed -E 's/(.*)(.[0-9])(.*)/echo "\1$((\2+1))\3"/ge' > tmp; mv tmp src/environments/translations.version.ts
      git add src/environments/translations.version.ts
      git commit -m "translations version bump [skip ci]"
      git push http://$USER_NAME:$ACCESS_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_PATH.git HEAD:$CI_COMMIT_REF_NAME
      fi

deploy_develop:
  only:
    variables:
      - $CI_COMMIT_TITLE =~ /^Merge branch (.*) 'deploy-develop'/
  stage: deploy
  script:
    - env
    - apt update -qq && apt install -y jq
    - |
      curl -s -u $JIRA_INTEGRATION_AUTH  -X GET    -H "Content-Type: application/json" $JIRA_JQL_PATH | jq -r '.issues[].self' | xargs -L 1 -I{} curl -s -u $JIRA_INTEGRATION_AUTH -H "Content-Type: application/json"  -d '{"transition":{"id":"51"}}' -X POST {}/transitions?expand=transitions.fields
    - git status
    - git remote add awscommit https://$(echo $CODE_COMMIT_KEY | base64 -d)@git-codecommit.eu-central-1.amazonaws.com/v1/repos/ourloop-ui
    - git push awscommit HEAD:refs/heads/develop --force
    - git push awscommit --tags --force

