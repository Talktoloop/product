# =============================================================================
# PRODUCTION deploy jobs
#
# Mirror every dev job above with main-branch + when:manual gating so a merge
# from develop -> main lands the code but does NOT auto-fire any pipeline.
# Each prod deploy is an explicit button click in the GitLab pipeline UI.
#
# `extends: .deploy-production` switches the GitLab environment scope to
# `production`, which resolves the `${X_PIPELINE_NAME}` and AWS_* variables
# against the production-scoped values in Settings -> CI/CD -> Variables.
# =============================================================================

# --- Cognito Lambdas ---

lambda-create-challenge-production:
  variables:
    PIPELINE_NAME: ${LAMBDA_CREATE_CHALLENGE_PIPELINE_NAME}
  extends: [.deploy-production]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - lambdas/auth/create_challenge/**/*
      when: manual
  stage: deploy

lambda-define-challenge-production:
  variables:
    PIPELINE_NAME: ${LAMBDA_DEFINE_CHALLENGE_PIPELINE_NAME}
  extends: [.deploy-production]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
