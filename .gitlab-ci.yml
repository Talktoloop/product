  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - lambdas/auth/pre_signup/**/*
      when: manual
  stage: deploy

lambda-verify-challenge-production:
  variables:
    PIPELINE_NAME: ${LAMBDA_VERIFY_CHALLENGE_PIPELINE_NAME}
  extends: [.deploy-production]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - lambdas/auth/verify_challenge/**/*
