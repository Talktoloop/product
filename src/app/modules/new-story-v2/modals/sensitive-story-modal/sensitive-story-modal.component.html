<loop-modal [title]="'newStoryV2.modals.sensitiveStory.title' | translate" class="new-story-v2" class="new-story-v2">
  <p class="loop-modal__paragraph pb-0625-125">{{ 'newStoryV2.modals.sensitiveStory.topParagraph' | translate }}</p>
  <ul>
    <li *ngFor="let option of listOptions">{{ 'newStoryV2.modals.sensitiveStory.list.' + option | translate }}</li>
  </ul>
  <p class="pt-0625-125">{{ 'newStoryV2.modals.sensitiveStory.bottomParagraph' | translate }}</p>
  <div action-buttons>
    <app-button (clicked)="onModalClose()" mode="v2" variant="primary">{{ 'newStoryV2.modals.ok' | translate }}</app-button>
  </div>
</loop-modal>
